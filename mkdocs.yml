site_name: ECGEN
site_description: ECG generation with VAE, VQ-VAE, GAN, Diffusion and State Space Models
site_url: https://vajira.info/ECGEN/
repo_url: https://github.com/vlbthambawita/ECGEN
repo_name: vlbthambawita/ECGEN
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 ECGEN contributors

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
    logo: material/heart-pulse
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: false
            show_root_toc_entry: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]
            heading_level: 3

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/architecture.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/architecture.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vlbthambawita/ECGEN

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting_started/installation.md
      - Quick Start: getting_started/quickstart.md
      - Configuration: getting_started/configuration.md
  - Datasets:
      - MIMIC-IV-ECG: datasets/mimic.md
      - Adding a Dataset: datasets/custom.md
  - Models:
      - Architecture Overview: models/architecture.md
      - VAE: models/vae.md
      - VQ-VAE + Prior: models/vqvae.md
      - Pulse2Pulse GAN: models/gan.md
  - Visual Guide:
      - visual/index.md
      - VAE: visual/vae.md
      - VQ-VAE + Prior: visual/vqvae.md
      - Pulse2Pulse GAN: visual/pulse2pulse.md
  - Training:
      - Training Guide: training/guide.md
      - VAE Training: training/vae_training.md
      - VQ-VAE Training: training/vqvae_training.md
      - Pulse2Pulse Training: training/pulse2pulse_training.md
      - Callbacks: training/callbacks.md
      - Training Scripts: training/scripts_comparison.md
  - Evaluation & Visualization:
      - Evaluation Metrics: evaluation/metrics.md
      - Visualization: visualization/guide.md
  - Standalone VQ-VAE: standalone/vqvae_standalone.md
  - API Reference:
      - Models: api/models.md
      - Data: api/data.md
      - Training: api/training.md
      - Evaluation: api/evaluation.md
      - Visualization: api/visualization.md
      - Utilities: api/utils.md
  - Reference:
      - Project Structure: project_structure.md
      - Changelog: changelog.md
      - Reorganization History: reorganization_history.md
