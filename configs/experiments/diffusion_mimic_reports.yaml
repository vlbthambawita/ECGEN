# Diffusion on MIMIC-IV-ECG conditioned on the machine report text (hashed
# bag-of-words tokens, no extra dependencies) through cross-attention.
#   ecgen train configs/experiments/diffusion_mimic_reports.yaml
# Sample: .sample(n, cond={"report": "Sinus tachycardia. Left axis deviation"}, guidance=2.0)

experiment: {name: diffusion_mimic_reports, seed: 42, runs_root: runs}

wandb: {enabled: false, project: ecg-diffusion}

model:
  name: diffusion
  params:
    in_channels: 12
    process: {name: ddpm, params: {schedule: cosine, prediction: v}}
    backbone: {name: unet1d, params: {base_channels: 64, channel_mults: [1, 2, 4, 4], attn_levels: [2, 3]}}
    conditioning:
      token_dim: 256
      encoders:
        - {field: report, name: text_hash, params: {dim: 256, vocab_size: 8192, max_tokens: 48}}
      dropout: {report: 0.15}
    lr: 0.0002
    warmup_steps: 1000
    ema_decay: 0.9995
    guidance: 2.0

data:
  dataset:
    name: mimic_iv_ecg
    params: {root: /work/vajira/DATA/SEARCH/MIMIC_IV_ECG_raw_v1/mimic-iv-ecg-diagnostic-electrocardiogram-matched-subset-1.0, max_samples: 50000, leads: standard12, scale: zscore, report: true, measurements: []}
  split_params: {val: {max_samples: 1000}}
  batch_size: 32
  num_workers: 8

checkpoint: {monitor: val_loss, mode: min, save_top_k: 3}

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: [0]
  precision: bf16-mixed
  log_every_n_steps: 50
  check_val_every_n_epoch: 1
  gradient_clip_val: 1.0
