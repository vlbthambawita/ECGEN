# VQ-VAE stage 1 on MIMIC-IV-ECG.
#   ecgen train configs/experiments/vqvae_mimic.yaml [key=value ...]
# Then train the prior (stage 2) with configs/experiments/prior_mimic.yaml.

experiment:
  name: vqvae_mimic
  seed: 42
  runs_root: runs

wandb:
  enabled: true
  project: ecg-vqvae
  entity: null
  run_name: null
  tags: [vqvae, ecg-generation, mimic-iv-ecg]
  notes: "VQ-VAE training on MIMIC-IV-ECG for discrete latent representation learning"
  log_model: false

model:
  name: vqvae               # ecgen.families.vqvae.VQVAELightning
  params:
    in_channels: 12
    base_channels: 64
    latent_channels: 64
    channel_multipliers: [1, 2, 4, 4]
    num_res_blocks: 2
    num_embeddings: 512
    commitment_cost: 0.25
    lr: 0.0001
    b1: 0.9
    b2: 0.999

data:
  dataset:
    name: mimic_iv_ecg
    params:
      root: /work/vajira/DATA/SEARCH/MIMIC_IV_ECG_raw_v1/mimic-iv-ecg-diagnostic-electrocardiogram-matched-subset-1.0
      max_samples: 1000     # null = full dataset
      skip_missing_check: false
      val_split: 0.1
      test_split: 0.1
      leads: null
      seq_length: 5000
      scale: zscore
  batch_size: 32
  num_workers: 4

checkpoint:
  monitor: val_loss
  mode: min
  save_top_k: 3

callbacks:
  - name: early_stopping
    params: {monitor: val_loss, patience: 10, mode: min, verbose: true}
  - name: lr_monitor
    params: {logging_interval: step}
  - name: vae_visualization  # also works for the VQ-VAE
    params:
      log_every_n_epochs: 1
      num_samples: 4
      plot_all_leads: true
      log_to_tensorboard: false
      log_to_wandb: true

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: [0]
  log_every_n_steps: 50
  check_val_every_n_epoch: 5
  gradient_clip_val: 1.0
  deterministic: true
