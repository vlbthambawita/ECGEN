# Conditional PixelCNN prior over a frozen stage-1 VQ-VAE, conditioned on the
# machine measurements; sample with classifier-free guidance.
#   ecgen train configs/experiments/prior_mimic_conditional.yaml \
#       model.params.vqvae_checkpoint=runs/vqvae_mimic/seed_42/checkpoints/last.ckpt
# Sample: PriorLightning.load_from_checkpoint(ckpt).sample(n, cond={...}, guidance=2.0)

experiment: {name: prior_mimic_conditional, seed: 42, runs_root: runs}

wandb: {enabled: false, project: ecg-vqvae-prior}

model:
  name: vqvae_prior
  params:
    num_embeddings: 512
    hidden_dim: 128
    num_layers: 10
    dilation_cycle: 10
    lr: 0.001
    vqvae_checkpoint: runs/vqvae_mimic/seed_42/checkpoints/last.ckpt
    conditioning:
      vector_dim: 128
      encoders:
        - {field: measurements, name: fourier, params: {num_features: 9, dim: 128}}
      dropout: {measurements: 0.15}   # enables classifier-free guidance

data:
  dataset:
    name: mimic_iv_ecg
    params:
      root: /work/vajira/DATA/SEARCH/MIMIC_IV_ECG_raw_v1/mimic-iv-ecg-diagnostic-electrocardiogram-matched-subset-1.0
      max_samples: 50000
      missing: mask
      leads: null          # must match the stage-1 VQ-VAE
      scale: zscore
  batch_size: 32
  num_workers: 8

checkpoint: {monitor: val_loss, mode: min, save_top_k: 3}

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: [0]
  log_every_n_steps: 50
  check_val_every_n_epoch: 1
  gradient_clip_val: 1.0
