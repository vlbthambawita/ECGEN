# Gaussian diffusion (DDPM, v-prediction, cosine schedule) with a 1D U-Net on MIMIC-IV-ECG.
#   ecgen train configs/experiments/diffusion_mimic.yaml
# Sample: DiffusionModule.load_from_checkpoint(ckpt).sample(n, steps=50)
# Inpainting without retraining: .sample(n, obs=x, obs_mask=m, inpaint="repaint")

experiment: {name: diffusion_mimic, seed: 42, runs_root: runs}

wandb: {enabled: false, project: ecg-diffusion}

model:
  name: diffusion
  params:
    in_channels: 12
    process: {name: ddpm, params: {num_steps: 1000, schedule: cosine, prediction: v, min_snr_gamma: 5.0}}
    backbone:
      name: unet1d
      params: {base_channels: 64, channel_mults: [1, 2, 4, 4], num_res_blocks: 2, attn_levels: [3], dropout: 0.0}
    lr: 0.0002
    warmup_steps: 1000
    ema_decay: 0.9995
    sample_steps: 50

data:
  dataset:
    name: mimic_iv_ecg
    params: {root: /work/vajira/DATA/SEARCH/MIMIC_IV_ECG_raw_v1/mimic-iv-ecg-diagnostic-electrocardiogram-matched-subset-1.0, max_samples: 50000, leads: standard12, scale: zscore}
  split_params: {val: {max_samples: 1000}}
  batch_size: 32
  num_workers: 8

checkpoint: {monitor: val_loss, mode: min, save_top_k: 3}

callbacks:
  - {name: lr_monitor, params: {logging_interval: step}}

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: [0]
  precision: bf16-mixed
  log_every_n_steps: 50
  check_val_every_n_epoch: 1
  gradient_clip_val: 1.0
