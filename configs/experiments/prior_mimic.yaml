# VQ-VAE stage 2: PixelCNN prior over the codes of a frozen stage-1 VQ-VAE.
#   ecgen train configs/experiments/prior_mimic.yaml model.params.vqvae_checkpoint=<stage1.ckpt>

experiment:
  name: prior_mimic
  seed: 42
  runs_root: runs

wandb:
  enabled: false
  project: ecg-vqvae-prior
  entity: null
  run_name: null
  tags: [vqvae, prior, pixelcnn, ecg-generation, mimic-iv-ecg]
  notes: "PixelCNN prior training for VQ-VAE discrete code distribution"
  log_model: false

model:
  name: vqvae_prior         # ecgen.families.vqvae.PriorLightning
  params:
    num_embeddings: 512     # must match the stage-1 VQ-VAE
    hidden_dim: 128
    num_layers: 10
    kernel_size: 2
    dilation_cycle: 10      # dilations 1..512 -> receptive field of 1024 codes
    lr: 0.001
    b1: 0.9
    b2: 0.999
    vqvae_checkpoint: runs/vqvae_mimic/seed_42/checkpoints/last.ckpt

data:
  dataset:
    name: mimic_iv_ecg
    params:
      root: /work/vajira/DATA/SEARCH/MIMIC_IV_ECG_raw_v1/mimic-iv-ecg-diagnostic-electrocardiogram-matched-subset-1.0
      max_samples: 10000
      skip_missing_check: false
      val_split: 0.1
      test_split: 0.1
      leads: null           # must match the stage-1 VQ-VAE's input
      seq_length: 5000
      scale: zscore
  batch_size: 32
  num_workers: 4

checkpoint:
  monitor: val_loss
  mode: min
  save_top_k: 3

callbacks:
  - name: early_stopping
    params: {monitor: val_loss, patience: 10, mode: min, verbose: true}
  - name: lr_monitor
    params: {logging_interval: step}

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: [0]
  log_every_n_steps: 50
  check_val_every_n_epoch: 5
  gradient_clip_val: 1.0
  deterministic: true
